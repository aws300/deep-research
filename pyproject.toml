[project]
name = "deepresearch"
version = "1.0.2"
description = "Elastic Deep Research service on Amazon Bedrock AgentCore harness (region/account agnostic, CloudFormation deployable)"
requires-python = ">=3.11"
dependencies = ["boto3>=1.42", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires deployed AWS resources (set DR_E2E=1)"]
pythonpath = ["src"]
addopts = "-ra"
